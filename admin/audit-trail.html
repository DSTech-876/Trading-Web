<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Audit Trail - Trading Web Dashboard</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
    
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmABheP7PHHY5rF1yTlKDfNLFNvfvh/NC" crossorigin="anonymous">
    
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" integrity="sha512-iecdLmaskl7CVJkEZSMUkrQ6usKu8zLI+C6LambVs87iNB5VwblKL8kDg6TA+fNXWNjkGQpiiFLQi+WS2YuZKg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    
    <!-- Modern Admin CSS -->
    <link href="./css/admin-modern.css" rel="stylesheet">
    
    <style>
        .audit-trail-container {
            padding-top: 20px;
        }
        
        .audit-filters {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }
        
        .audit-timeline {
            position: relative;
        }
        
        .audit-entry {
            padding: 20px;
            margin-bottom: 15px;
            background: var(--bg-card);
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        
        .audit-entry:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transform: translateX(2px);
        }
        
        .audit-entry.action-create {
            border-left-color: var(--success);
        }
        
        .audit-entry.action-update {
            border-left-color: var(--info);
        }
        
        .audit-entry.action-delete {
            border-left-color: var(--danger);
        }
        
        .audit-entry.action-lock {
            border-left-color: var(--warning);
        }
        
        .audit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .audit-action {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
        }
        
        .audit-action.create {
            background-color: rgba(40, 167, 69, 0.1);
            color: var(--success);
        }
        
        .audit-action.update {
            background-color: rgba(23, 162, 184, 0.1);
            color: var(--info);
        }
        
        .audit-action.delete {
            background-color: rgba(220, 53, 69, 0.1);
            color: var(--danger);
        }
        
        .audit-action.lock {
            background-color: rgba(255, 193, 7, 0.1);
            color: var(--warning);
        }
        
        .audit-details {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        .audit-values {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        
        .audit-value-pair {
            font-size: 0.875rem;
        }
        
        .audit-value-label {
            font-weight: 600;
            color: var(--text-primary);
            display: block;
            margin-bottom: 4px;
        }
        
        .audit-value-old {
            color: var(--danger);
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }
        
        .audit-value-new {
            color: var(--success);
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }
        
        .audit-meta {
            display: flex;
            gap: 20px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 12px;
        }
        
        .audit-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .skeleton-entry {
            height: 120px;
            background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-tertiary) 50%, var(--bg-secondary) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .filter-section {
            margin-bottom: 20px;
        }
        
        .filter-section label {
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="./">
                <i class="fas fa-chart-line me-2"></i>Trading Dashboard
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="./dashboard-home.html">
                            <i class="fas fa-home me-2"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./user-management.html">
                            <i class="fas fa-users me-2"></i>Users
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="./audit-trail.html">
                            <i class="fas fa-history me-2"></i>Audit Trail
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid audit-trail-container">
        <!-- Page Header -->
        <div class="row mb-4">
            <div class="col-md-6">
                <h1 class="h3 fw-bold">
                    <i class="fas fa-history me-2 text-info"></i>Admin Audit Trail
                </h1>
                <p class="text-muted mb-0">Track all administrative actions and changes</p>
            </div>
            <div class="col-md-6 text-end">
                <div data-audit-trail-controls>
                    <button class="btn btn-primary" id="exportBtn">
                        <i class="fas fa-download me-2"></i>Export
                    </button>
                </div>
                <button class="btn btn-secondary" id="refreshBtn">
                    <i class="fas fa-sync me-2"></i>Refresh
                </button>
            </div>
        </div>

        <!-- Filters -->
        <div class="audit-filters">
            <div class="row g-3">
                <div class="col-md-3">
                    <div class="filter-section">
                        <label for="filterAdmin">Admin User</label>
                        <input type="text" class="form-control form-control-sm" id="filterAdmin" placeholder="Admin username or ID">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="filter-section">
                        <label for="filterAction">Action Type</label>
                        <select class="form-select form-select-sm" id="filterAction">
                            <option value="">All Actions</option>
                            <option value="create">Create</option>
                            <option value="update">Update</option>
                            <option value="delete">Delete</option>
                            <option value="lock">Lock/Unlock</option>
                            <option value="impersonate">Impersonate</option>
                            <option value="permission">Permission Change</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="filter-section">
                        <label for="filterEntity">Entity Type</label>
                        <select class="form-select form-select-sm" id="filterEntity">
                            <option value="">All Entities</option>
                            <option value="user">User</option>
                            <option value="subscription">Subscription</option>
                            <option value="rule">Rule</option>
                            <option value="notification">Notification</option>
                            <option value="preference">Preference</option>
                            <option value="setting">Setting</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="filter-section">
                        <label for="filterDate">Date Range</label>
                        <input type="date" class="form-control form-control-sm" id="filterDate">
                    </div>
                </div>
            </div>
            <div class="row g-3 mt-1">
                <div class="col-md-6">
                    <input type="text" class="form-control form-control-sm" id="filterSearch" placeholder="Search in audit messages...">
                </div>
                <div class="col-md-6">
                    <button class="btn btn-sm btn-primary w-100" id="applyFiltersBtn">
                        <i class="fas fa-filter me-2"></i>Apply Filters
                    </button>
                </div>
            </div>
        </div>

        <!-- Audit Trail List -->
        <div class="audit-timeline">
            <div id="auditList"></div>
            
            <!-- Loading Skeleton -->
            <div id="loadingSkeleton" style="display: none;">
                <div class="skeleton-entry"></div>
                <div class="skeleton-entry"></div>
                <div class="skeleton-entry"></div>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="text-center py-5" style="display: none;">
                <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                <h4 class="text-muted">No audit entries found</h4>
                <p class="text-muted small">Try adjusting your filters</p>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-between align-items-center mt-4">
                <div id="paginationInfo" class="text-muted small"></div>
                <nav>
                    <ul class="pagination mb-0">
                        <li class="page-item"><a class="page-link" href="#" id="prevPage">Previous</a></li>
                        <li class="page-item"><span class="page-link" id="currentPage">Page 1</span></li>
                        <li class="page-item"><a class="page-link" href="#" id="nextPage">Next</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWbSxccPQtF3EpF3fnJHog6LaEVF6+rWBdXKvP+yPf7cqIIxIw" crossorigin="anonymous"></script>
    <script src="../auth.js"></script>
    <script src="./js/components.js"></script>
    <script src="./js/audit-trail-export.js"></script>
     
    <script>
        let currentPage = 1;
        const perPage = 25;
        let totalEntries = 0;

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadAuditTrail();
            
            // Event listeners
            document.getElementById('applyFiltersBtn').addEventListener('click', () => {
                currentPage = 1;
                loadAuditTrail();
            });
            
            document.getElementById('refreshBtn').addEventListener('click', () => {
                currentPage = 1;
                loadAuditTrail();
            });
            
            document.getElementById('nextPage').addEventListener('click', (e) => {
                e.preventDefault();
                if (currentPage * perPage < totalEntries) {
                    currentPage++;
                    loadAuditTrail();
                }
            });
            
            document.getElementById('prevPage').addEventListener('click', (e) => {
                e.preventDefault();
                if (currentPage > 1) {
                    currentPage--;
                    loadAuditTrail();
                }
            });
        });

        function loadAuditTrail() {
            showLoading();
            
            const filters = {
                page: currentPage,
                per_page: perPage,
                admin: document.getElementById('filterAdmin').value,
                action: document.getElementById('filterAction').value,
                entity_type: document.getElementById('filterEntity').value,
                date: document.getElementById('filterDate').value,
                search: document.getElementById('filterSearch').value
            };
            
            const queryString = Object.keys(filters)
                .filter(key => filters[key])
                .map(key => `${key}=${encodeURIComponent(filters[key])}`)
                .join('&');
            
            AdminComponents.apiRequest(`/admin/audit_trail?${queryString}`)
            .then(data => {
                if (!data.success) throw new Error(data.error);
                
                totalEntries = data.total;
                renderAuditTrail(data.entries || []);
                updatePagination();
                hideLoading();
            })
            .catch(err => {
                console.error('Failed to load audit trail:', err);
                AdminComponents.showAlert('Error loading audit trail: ' + err.message, 'danger');
                hideLoading();
            });
        }

        function renderAuditTrail(entries) {
            const container = document.getElementById('auditList');
            
            if (entries.length === 0) {
                container.innerHTML = '';
                document.getElementById('emptyState').style.display = 'block';
                return;
            }
            
            document.getElementById('emptyState').style.display = 'none';
            
            container.innerHTML = entries.map(entry => {
                const actionClass = String(entry.action || '').toLowerCase().replace(/_/g, '-').replace(/[^a-z0-9-]/g, '');
                const actionLabel = formatActionLabel(entry.action);
                
                let valuesHtml = '';
                if (entry.old_value || entry.new_value) {
                    valuesHtml = `
                        <div class="audit-values">
                            <div class="audit-value-pair">
                                <span class="audit-value-label">Previous Value:</span>
                                <div class="audit-value-old">${escapeHtml(entry.old_value || '—')}</div>
                            </div>
                            <div class="audit-value-pair">
                                <span class="audit-value-label">New Value:</span>
                                <div class="audit-value-new">${escapeHtml(entry.new_value || '—')}</div>
                            </div>
                        </div>
                    `;
                }
                
                return `
                    <div class="audit-entry action-${actionClass}">
                        <div class="audit-header">
                            <div>
                                <span class="audit-action ${actionClass.split('-')[0]}">${escapeHtml(actionLabel)}</span>
                                <strong class="ms-3">${escapeHtml((entry.entity_type || '').toUpperCase())}</strong>
                                ${entry.entity_id ? `<code class="ms-2">#${escapeHtml(entry.entity_id)}</code>` : ''}
                            </div>
                            <small class="text-muted">${escapeHtml(formatDate(entry.created_at))}</small>
                        </div>
                        <div class="audit-details">
                            <strong>${escapeHtml(entry.admin_name || entry.admin_id)}</strong> 
                            ${escapeHtml(getActionDescription(entry))}
                        </div>
                        ${valuesHtml}
                        <div class="audit-meta">
                            <div class="audit-meta-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <span>${escapeHtml(entry.ip_address || 'Unknown')}</span>
                            </div>
                            <div class="audit-meta-item">
                                <i class="fas fa-check-circle"></i>
                                <span>${escapeHtml(entry.status || 'completed')}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatActionLabel(action) {
            return action.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function getActionDescription(entry) {
            const actions = {
                'user_created': 'created new user',
                'user_updated': 'updated user profile',
                'user_deleted': 'deleted user account',
                'user_locked': 'locked user account',
                'user_unlocked': 'unlocked user account',
                'subscription_changed': 'changed subscription plan',
                'rule_created': 'created new rule',
                'rule_updated': 'updated rule',
                'rule_deleted': 'deleted rule',
                'permission_granted': 'granted permission',
                'permission_revoked': 'revoked permission',
                'adaptive_reset': 'reset adaptive intelligence',
                'impersonation_started': 'started user impersonation',
                'impersonation_ended': 'ended user impersonation'
            };
            
            return actions[entry.action] || entry.action.replace(/_/g, ' ').toLowerCase();
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays < 7) return `${diffDays}d ago`;
            
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function updatePagination() {
            const lastPage = Math.ceil(totalEntries / perPage);
            document.getElementById('currentPage').textContent = `Page ${currentPage}`;
            document.getElementById('paginationInfo').textContent = `Showing ${(currentPage - 1) * perPage + 1}-${Math.min(currentPage * perPage, totalEntries)} of ${totalEntries}`;
            
            document.getElementById('prevPage').parentElement.className = currentPage > 1 ? 'page-item' : 'page-item disabled';
            document.getElementById('nextPage').parentElement.className = currentPage < lastPage ? 'page-item' : 'page-item disabled';
        }

        function showLoading() {
            document.getElementById('auditList').innerHTML = '';
            document.getElementById('loadingSkeleton').style.display = 'block';
            document.getElementById('emptyState').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loadingSkeleton').style.display = 'none';
        }
    </script>
</body>
</html>
