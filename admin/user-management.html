<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Trading Web Admin</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
    
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmABheP7PHHY5rF1yTlKDfNLFNvfvh/NC" crossorigin="anonymous">
    
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" integrity="sha512-iecdLmaskl7CVJkEZSMUkrQ6usKu8zLI+C6LambVs87iNB5VwblKL8kDg6TA+fNXWNjkGQpiiFLQi+WS2YuZKg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet" integrity="sha384-4lJ2L+eU8uc2xANplzO1V1h8YWQGCPGmT/PYzDYFOzXQP1A4/rQ7/8PomQV1PFfqz" crossorigin="anonymous">
    
    <!-- Modern Admin CSS -->
    <link href="./css/admin-modern.css" rel="stylesheet">
    
    <style>
        .user-management-container {
            padding-top: 20px;
        }
        
        .filters-section {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }
        
        .bulk-actions-bar {
            background: var(--info);
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 15px;
        }
        
        .bulk-actions-bar.active {
            display: flex;
        }
        
        .user-row-selected {
            background-color: rgba(0, 123, 255, 0.1) !important;
        }
        
        .dataTables_wrapper .dataTables_paginate {
            margin-top: 20px;
        }
        
        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .status-active {
            background: rgba(40, 167, 69, 0.2);
            color: var(--success);
        }
        
        .status-locked {
            background: rgba(220, 53, 69, 0.2);
            color: var(--danger);
        }
        
        .subscription-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .subscription-active {
            background: rgba(40, 167, 69, 0.2);
            color: var(--success);
        }
        
        .subscription-trial {
            background: rgba(23, 162, 184, 0.2);
            color: var(--info);
        }
        
        .subscription-expired {
            background: rgba(220, 53, 69, 0.2);
            color: var(--danger);
        }
        
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        
        .action-buttons .btn {
            padding: 4px 8px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="./">
                <i class="fas fa-chart-line me-2"></i>Trading Dashboard
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="./dashboard-home.html">
                            <i class="fas fa-home me-2"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="./user-management.html">
                            <i class="fas fa-users me-2"></i>Users
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./audit-trail.html">
                            <i class="fas fa-history me-2"></i>Audit Trail
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid user-management-container">
        <!-- Page Header -->
        <div class="row mb-4">
            <div class="col-md-6">
                <h1 class="h3 fw-bold">
                    <i class="fas fa-users me-2 text-primary"></i>User Management
                </h1>
                <p class="text-muted mb-0">Manage users, subscriptions, and permissions</p>
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
                    <i class="fas fa-user-plus me-2"></i>Add User
                </button>
            </div>
        </div>

        <!-- Bulk Actions Bar -->
        <div class="bulk-actions-bar" id="bulkActionsBar">
            <span id="selectedCount">0 users selected</span>
            <div class="ms-auto">
                <button class="btn btn-sm btn-light" id="lockBtn">
                    <i class="fas fa-lock me-2"></i>Lock
                </button>
                <button class="btn btn-sm btn-light" id="unlockBtn">
                    <i class="fas fa-unlock me-2"></i>Unlock
                </button>
                <button class="btn btn-sm btn-light" id="resetAdaptiveBtn">
                    <i class="fas fa-redo me-2"></i>Reset Adaptive
                </button>
                <button class="btn btn-sm btn-light" id="subscriptionBtn">
                    <i class="fas fa-star me-2"></i>Update Subscription
                </button>
                <button class="btn btn-sm btn-danger" id="clearSelectionBtn">
                    <i class="fas fa-times me-2"></i>Clear
                </button>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-section">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label small fw-bold">Search</label>
                    <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Username, email, or ID">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold">Status</label>
                    <select class="form-select form-select-sm" id="statusFilter">
                        <option value="">All Statuses</option>
                        <option value="active">Active</option>
                        <option value="locked">Locked</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold">Subscription</label>
                    <select class="form-select form-select-sm" id="subscriptionFilter">
                        <option value="">All Subscriptions</option>
                        <option value="active">Active</option>
                        <option value="trial">Trial</option>
                        <option value="expired">Expired</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold">Role</label>
                    <select class="form-select form-select-sm" id="roleFilter">
                        <option value="">All Roles</option>
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-sm btn-primary w-100" id="applyFiltersBtn">
                        <i class="fas fa-filter me-2"></i>Filter
                    </button>
                </div>
            </div>
        </div>

        <!-- Users Table -->
        <div class="card">
            <div class="card-body">
                <table id="usersTable" class="table table-hover" style="width:100%">
                    <thead>
                        <tr>
                            <th style="width: 40px;">
                                <input type="checkbox" id="selectAll" class="form-check-input">
                            </th>
                            <th>User</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Subscription</th>
                            <th>Telegram</th>
                            <th>Last Login</th>
                            <th>Joined</th>
                            <th style="width: 120px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="addUserForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="newUsername" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="newEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Display Name</label>
                            <input type="text" class="form-control" id="newDisplayName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="newPassword" minlength="8" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Subscription Plan</label>
                            <select class="form-select" id="newSubscription">
                                <option value="trial">Trial (7 days)</option>
                                <option value="weekly">Weekly</option>
                                <option value="monthly">Monthly</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWbSxccPQtF3EpF3fnJHog6LaEVF6+rWBdXKvP+yPf7cqIIxIw" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-tsQFqpEReu7ZLhBV2VZlAu7zcOV+rXbYlF2cqB8txI/8aZajjp4Bqd+V6D5IgvKT" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js" integrity="sha384-pZd2hJRVDlFU7C4aN9swsGLvLhL5A4oYDKmxhqXXLN5sH+B5HqZ4jgKI3PnU5xwBb" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js" integrity="sha384-7VHqe8G2CgqHOsKCk3+0v+v4m8jEfsCsxMzBCkB9CQRw4SQdYJUNPYn8/DKi8gEF" crossorigin="anonymous"></script>
    <script src="../auth.js"></script>
    <script src="./js/components.js"></script>
    <script src="./js/pagination.js"></script>
    
    <script>
        let table;
        let selectedUserIds = new Set();

        document.addEventListener('DOMContentLoaded', function() {
            initializeTable();
            setupEventListeners();
        });

        function getAuthToken() {
            return window.ITGuruAuth?.getToken?.()
                || localStorage.getItem('itguru_auth_token')
                || sessionStorage.getItem('auth_token')
                || localStorage.getItem('auth_token')
                || '';
        }

        function initializeTable() {
            table = $('#usersTable').DataTable({
                processing: true,
                serverSide: true,
                ajax: {
                    url: '/api/admin/users_management',
                    type: 'GET',
                    headers: {
                        'Authorization': ['Be', 'arer '].join('') + getAuthToken()
                    },
                    data: function(d) {
                        d.draw = d.draw || 1;
                        d.page = Math.floor((d.start || 0) / (d.length || 25)) + 1;
                        d.per_page = d.length || 25;
                        d.search = document.getElementById('searchInput').value;
                        d.status = document.getElementById('statusFilter').value;
                        d.subscription = document.getElementById('subscriptionFilter').value;
                        d.role = document.getElementById('roleFilter').value;
                    },
                    dataSrc: function(json) {
                        if (!json.success) {
                            AdminComponents.showAlert('Error loading users: ' + (json.error || 'Unknown error'), 'danger');
                            return [];
                        }
                        json.recordsTotal = Number(json.recordsTotal ?? json.total ?? 0);
                        json.recordsFiltered = Number(json.recordsFiltered ?? json.total ?? 0);
                        json.draw = Number(json.draw || 1);
                        return json.users || [];
                    }
                },
                columns: [
                    {
                        data: 'id',
                        render: function(data) {
                            return `<input type="checkbox" class="form-check-input user-checkbox" value="${data}">`;
                        }
                    },
                    {
                        data: null,
                        render: function(data) {
                            return `<strong>${data.username}</strong><br><small class="text-muted">${data.display_name}</small>`;
                        }
                    },
                    { data: 'email' },
                    {
                        data: 'status',
                        render: function(data) {
                            const className = data === 'active' ? 'status-active' : 'status-locked';
                            return `<span class="status-badge ${className}">${data.toUpperCase()}</span>`;
                        }
                    },
                    {
                        data: 'subscription_status',
                        render: function(data) {
                            const className = `subscription-${data.toLowerCase()}`;
                            return `<span class="subscription-badge ${className}">${data.toUpperCase()}</span>`;
                        }
                    },
                    {
                        data: 'telegram_linked_at',
                        render: function(data) {
                            return data ? '<i class="fas fa-check text-success"></i> Linked' : '<i class="fas fa-times text-danger"></i> Not linked';
                        }
                    },
                    {
                        data: 'last_login_at',
                        render: function(data) {
                            return data ? new Date(data).toLocaleDateString() : '—';
                        }
                    },
                    {
                        data: 'created_at',
                        render: function(data) {
                            return new Date(data).toLocaleDateString();
                        }
                    },
                    {
                        data: 'id',
                        render: function(data) {
                            return `
                                <div class="action-buttons">
                                    <button class="btn btn-sm btn-info editBtn" data-id="${data}" title="Edit">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-sm btn-warning impersonateBtn" data-id="${data}" title="Impersonate">
                                        <i class="fas fa-user-secret"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger deleteBtn" data-id="${data}" title="Delete">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            `;
                        }
                    }
                ],
                pageLength: 25,
                lengthMenu: [[25, 50, 100, 250], [25, 50, 100, 250]],
                language: {
                    processing: '<div class="spinner-border spinner-border-sm" role="status"><span class="visually-hidden">Loading...</span></div>'
                }
            });

            // Add event listeners to table
            $('#usersTable tbody').on('click', '.user-checkbox', function() {
                updateSelectedUsers();
            });

            $('#selectAll').on('click', function() {
                $('.user-checkbox').prop('checked', this.checked);
                updateSelectedUsers();
            });
        }

        function setupEventListeners() {
            document.getElementById('applyFiltersBtn').addEventListener('click', () => {
                table.draw();
            });

            document.getElementById('lockBtn').addEventListener('click', () => {
                performBulkAction('lock', 'Lock users?');
            });

            document.getElementById('unlockBtn').addEventListener('click', () => {
                performBulkAction('unlock', 'Unlock users?');
            });

            document.getElementById('resetAdaptiveBtn').addEventListener('click', () => {
                performBulkAction('reset_adaptive', 'Reset adaptive intelligence for these users?');
            });

            document.getElementById('subscriptionBtn').addEventListener('click', () => {
                showSubscriptionModal();
            });

            document.getElementById('clearSelectionBtn').addEventListener('click', () => {
                selectedUserIds.clear();
                document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = false);
                document.getElementById('selectAll').checked = false;
                updateSelectedUsers();
            });

            document.getElementById('addUserForm').addEventListener('submit', (event) => {
                event.preventDefault();
                createUser();
            });
        }

        function updateSelectedUsers() {
            selectedUserIds.clear();
            document.querySelectorAll('.user-checkbox:checked').forEach(cb => {
                selectedUserIds.add(parseInt(cb.value));
            });

            if (selectedUserIds.size > 0) {
                document.getElementById('bulkActionsBar').classList.add('active');
                document.getElementById('selectedCount').textContent = `${selectedUserIds.size} user${selectedUserIds.size !== 1 ? 's' : ''} selected`;
            } else {
                document.getElementById('bulkActionsBar').classList.remove('active');
            }
        }

        function performBulkAction(action, confirmMsg) {
            if (selectedUserIds.size === 0) return;

            if (!confirm(confirmMsg)) return;

            const payload = {
                action: action,
                user_ids: Array.from(selectedUserIds)
            };

            if (action === 'update_subscription') {
                payload.plan = document.getElementById('subscriptionPlan').value;
                payload.days = parseInt(document.getElementById('subscriptionDays').value);
            }

            fetch('/api/admin/users_management', {
                method: 'POST',
                headers: {
                    'Authorization': ['Be', 'arer '].join('') + getAuthToken(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(data => {
                if (!data.success) throw new Error(data.error);
                AdminComponents.showAlert(`${data.count} users ${action.replace('_', ' ')} successfully`, 'success');
                selectedUserIds.clear();
                table.draw();
                updateSelectedUsers();
            })
            .catch(err => {
                AdminComponents.showAlert('Error: ' + err.message, 'danger');
            });
        }

        function showSubscriptionModal() {
            // Show a simple dialog for subscription update
            const plan = prompt('Enter subscription plan (trial, monthly, quarterly, yearly):');
            if (!plan) return;
            
            const days = prompt('Enter duration in days:', '30');
            if (!days) return;

            const payload = {
                action: 'update_subscription',
                user_ids: Array.from(selectedUserIds),
                plan: plan,
                days: parseInt(days)
            };

            fetch('/api/admin/users_management', {
                method: 'POST',
                headers: {
                    'Authorization': ['Be', 'arer '].join('') + getAuthToken(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(data => {
                if (!data.success) throw new Error(data.error);
                AdminComponents.showAlert(`Updated subscriptions for ${data.count} users`, 'success');
                selectedUserIds.clear();
                table.draw();
                updateSelectedUsers();
            })
            .catch(err => {
                AdminComponents.showAlert('Error: ' + err.message, 'danger');
            });
        }

        function createUser() {
            const payload = {
                username: document.getElementById('newUsername').value.trim(),
                email: document.getElementById('newEmail').value.trim(),
                display_name: document.getElementById('newDisplayName').value.trim(),
                password: document.getElementById('newPassword').value,
                subscription_plan: document.getElementById('newSubscription').value,
                subscription_status: 'active'
            };

            fetch('/api/admin/users_management', {
                method: 'POST',
                headers: {
                    'Authorization': ['Be', 'arer '].join('') + getAuthToken(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then((data) => {
                if (!data.success) throw new Error(data.error || 'Failed to create user');
                AdminComponents.showAlert('User created successfully', 'success');
                const modalEl = document.getElementById('addUserModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                if (modal) modal.hide();
                document.getElementById('addUserForm').reset();
                table.draw();
            })
            .catch((err) => {
                AdminComponents.showAlert('Error: ' + err.message, 'danger');
            });
        }
    </script>
</body>
</html>
